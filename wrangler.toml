# Cloudflare Pages Configuration
name = "my-notes-app"
compatibility_date = "2024-01-01"

[build]
command = "npm run build"
cwd = "."
watch_dir = "src"

[build.upload]
format = "service-worker"
dir = "dist"

[[build.upload.rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]

[[build.upload.rules]]
type = "Text"
globs = ["**/*.txt", "**/*.html", "**/*.json"]

[[build.upload.rules]]
type = "Data"
globs = ["**/*"]
